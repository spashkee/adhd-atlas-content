name: Content CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify remote content
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check FCM sender syntax
        run: node --check scripts/send-fcm-topic.mjs

      - name: Validate Android 0.11.0 compatibility
        run: node scripts/validate-v011-compatibility.mjs

      - name: Validate content files
        run: |
          node --input-type=module <<'NODE'
          import {
            existsSync,
            readFileSync,
          } from "node:fs";

          const manifest = JSON.parse(
            readFileSync("manifest.json", "utf8"),
          );
          const catalog = JSON.parse(
            readFileSync("catalog.json", "utf8"),
          );

          if (
            manifest.contentVersion !==
            catalog.contentVersion
          ) {
            throw new Error("contentVersion mismatch");
          }

          if (
            manifest.articles.length !==
            catalog.articles.length
          ) {
            throw new Error("article count mismatch");
          }

          const manifestById = new Map(
            manifest.articles.map(
              (article) => [
                article.id,
                article.file,
              ],
            ),
          );

          for (const article of catalog.articles) {
            if (
              manifestById.get(article.id) !==
              article.file
            ) {
              throw new Error(
                `catalog/manifest mismatch: ${article.id}`,
              );
            }

            if (
              !existsSync(
                `articles/${article.file}`,
              )
            ) {
              throw new Error(
                `missing article file: ${article.file}`,
              );
            }
          }

          if (existsSync("campaign.json")) {
            const campaign = JSON.parse(
              readFileSync("campaign.json", "utf8"),
            );

            if (
              campaign.schemaVersion !== 1 ||
              typeof campaign.campaignId !== "string" ||
              typeof campaign.version !== "number" ||
              typeof campaign.enabled !== "boolean" ||
              typeof campaign.startsAt !== "string" ||
              typeof campaign.endsAt !== "string" ||
              typeof campaign.theme !== "string" ||
              typeof campaign.title !== "string" ||
              typeof campaign.subtitle !== "string" ||
              !Array.isArray(campaign.featuredArticles)
            ) {
              throw new Error("invalid campaign.json schema");
            }

            const start = Date.parse(campaign.startsAt);
            const end = Date.parse(campaign.endsAt);

            if (
              !Number.isFinite(start) ||
              !Number.isFinite(end) ||
              end <= start
            ) {
              throw new Error("invalid campaign date range");
            }

            const articleIds = new Set(
              catalog.articles.map(
                (article) => article.id,
              ),
            );

            for (
              const articleId of
              campaign.featuredArticles
            ) {
              if (
                typeof articleId !== "string" ||
                !articleIds.has(articleId)
              ) {
                throw new Error(
                  `campaign references missing article: ${articleId}`,
                );
              }
            }

            if (
              campaign.primaryAction?.articleId &&
              !articleIds.has(
                campaign.primaryAction.articleId,
              )
            ) {
              throw new Error(
                "campaign primary action references missing article",
              );
            }

            if (
              campaign.secondaryAction?.route &&
              typeof campaign.secondaryAction.route !==
                "string"
            ) {
              throw new Error(
                "campaign secondary route must be a string",
              );
            }

            console.log(
              `Campaign OK: ${campaign.campaignId}, ${campaign.featuredArticles.length} featured articles`,
            );
          }

          console.log(
            `Remote content OK: ${catalog.contentVersion}, ${catalog.articles.length} articles`,
          );
          NODE

      - name: Validate seasonal campaign against client schema
        run: node scripts/validate-campaign.mjs
