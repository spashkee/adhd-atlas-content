name: Update notifications content CI

on:
  push:
    branches:
      - feat/update-notifications-2

permissions:
  contents: read

jobs:
  verify:
    name: Verify content notification sender
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check sender syntax
        run: node --check scripts/send-fcm-topic.mjs

      - name: Parse content JSON
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const manifest = JSON.parse(
            readFileSync("manifest.json", "utf8")
          );
          const catalog = JSON.parse(
            readFileSync("catalog.json", "utf8")
          );

          if (manifest.contentVersion !== catalog.contentVersion) {
            throw new Error("contentVersion mismatch");
          }

          console.log(
            `contentVersion ${manifest.contentVersion} is valid`
          );
          NODE
